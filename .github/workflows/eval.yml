name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile skeleton
        run: python -m compileall app.py graph agents retrieval ingestion synth llm eval
      - name: Chunking edge smoke test
        run: python scripts/chunking_edge_smoke.py
      - name: Ingestion smoke test
        run: python scripts/ingestion_smoke.py
      - name: Router state smoke test
        run: python scripts/router_state_smoke.py
      - name: Graph flow smoke test
        run: python scripts/graph_flow_smoke.py
      - name: Deep research smoke test
        run: python scripts/deep_research_smoke.py
      - name: Specialist fanout smoke test
        run: python scripts/specialist_fanout_smoke.py
      - name: Topology catalog smoke test
        run: python scripts/topology_catalog_smoke.py
      - name: Terraform emit smoke test
        run: python scripts/terraform_emit_smoke.py
      - name: Terraform export smoke test
        run: python scripts/terraform_export_smoke.py
      - name: Retrieval smoke test
        run: python scripts/retrieval_smoke.py
      - name: Vector store smoke test
        run: python scripts/vector_store_smoke.py
      - name: Vector index manifest smoke test
        run: python scripts/vector_index_manifest_smoke.py
      - name: LLM provider smoke test
        run: python scripts/llm_provider_smoke.py
      - name: App formatting smoke test
        run: python scripts/app_formatting_smoke.py
      - name: Production readiness demo check
        run: python scripts/production_readiness_check.py --profile demo
      - name: Public API endpoint smoke test
        env:
          LLM_PROVIDER: disabled
          GRADIO_SERVER_NAME: 127.0.0.1
          GRADIO_SERVER_PORT: 8022
        run: |
          python -m pip install "gradio>=4.44"
          python app.py >/tmp/rag-advisor-api.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          python - <<'PY'
          import pathlib
          import socket
          import time

          deadline = time.time() + 90
          while time.time() < deadline:
              sock = socket.socket()
              try:
                  sock.settimeout(1)
                  sock.connect(("127.0.0.1", 8022))
                  break
              except OSError:
                  time.sleep(1)
              finally:
                  sock.close()
          else:
              print(pathlib.Path("/tmp/rag-advisor-api.log").read_text())
              raise SystemExit("Gradio server did not start")
          PY
          python scripts/api_output_probe.py --url http://127.0.0.1:8022 --deep-thinking
      - name: Audit log smoke test
        run: python scripts/audit_log_smoke.py
      - name: Gold-set eval gate
        run: python eval/harness.py --gate
      - name: Answer-set eval gate
        run: python eval/harness.py --gold eval/gold/v0_4_answer_quality.json --gate
      - name: Panel-quality eval gate
        run: python eval/harness.py --gold eval/gold/v0_5_panel_quality.json --gate
      - name: Graph smoke test
        env:
          LLM_PROVIDER: disabled
        run: |
          python -c "from graph.build import build_graph; s = build_graph().invoke({'user_brief': 'internal API docs assistant'}); assert s.draft_output; print(s.domain_prior)"
