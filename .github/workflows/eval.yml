name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile skeleton
        run: python -m compileall app.py graph agents retrieval ingestion synth llm eval
      - name: Chunking edge smoke test
        run: python scripts/chunking_edge_smoke.py
      - name: Ingestion smoke test
        run: python scripts/ingestion_smoke.py
      - name: Router state smoke test
        run: python scripts/router_state_smoke.py
      - name: Graph flow smoke test
        run: python scripts/graph_flow_smoke.py
      - name: Specialist fanout smoke test
        run: python scripts/specialist_fanout_smoke.py
      - name: Retrieval smoke test
        run: python scripts/retrieval_smoke.py
      - name: Vector store smoke test
        run: python scripts/vector_store_smoke.py
      - name: LLM provider smoke test
        run: python scripts/llm_provider_smoke.py
      - name: App formatting smoke test
        run: python scripts/app_formatting_smoke.py
      - name: Gold-set eval gate
        run: python eval/harness.py --gate
      - name: Answer-set eval gate
        run: python eval/harness.py --gold eval/gold/v0_4_answer_quality.json --gate
      - name: Graph smoke test
        env:
          LLM_PROVIDER: disabled
        run: |
          python -c "from graph.build import build_graph; s = build_graph().invoke({'user_brief': 'internal API docs assistant'}); assert s.draft_output; print(s.domain_prior)"
